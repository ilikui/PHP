<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>反馈表单</title>
</head>
<body>
  <main>
    <h1>反馈表单</h1>
    <p>请填写以下内容。浏览器校验只改善体验，服务端仍会再次校验。</p>
    <form action="handle_form.php" method="post">
      <p>
        <label for="title">称谓</label>
        <select id="title" name="title" required>
          <option value="Mr.">Mr.</option>
          <option value="Mrs.">Mrs.</option>
          <option value="Ms.">Ms.</option>
          <option value="Mx.">Mx.</option>
        </select>
      </p>
      <p>
        <label for="name">姓名</label>
        <input id="name" type="text" name="name" maxlength="80" required>
      </p>
      <p>
        <label for="email">电子邮箱</label>
        <input id="email" type="email" name="email" maxlength="254" required>
      </p>
      <fieldset>
        <legend>本次体验</legend>
        <label><input type="radio" name="response" value="excellent" required> 很好</label>
        <label><input type="radio" name="response" value="okay"> 一般</label>
        <label><input type="radio" name="response" value="boring"> 不满意</label>
      </fieldset>
      <p>
        <label for="comments">补充意见</label><br>
        <textarea id="comments" name="comments" cols="40" rows="5" maxlength="2000"></textarea>
      </p>
      <button type="submit">提交反馈</button>
    </form>
  </main>
</body>
</html>
