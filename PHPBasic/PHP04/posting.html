<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发布内容</title>
</head>
<body>
  <main>
    <h1>发布内容</h1>
    <p>提交内容仅用于演示表单处理，不会保存到数据库。</p>
    <form action="handle_post.php" method="post">
      <p><label for="first_name">名</label>
        <input id="first_name" type="text" name="first_name" maxlength="80" required></p>
      <p><label for="last_name">姓</label>
        <input id="last_name" type="text" name="last_name" maxlength="80" required></p>
      <p><label for="email">电子邮箱</label>
        <input id="email" type="email" name="email" maxlength="254" required></p>
      <p><label for="posting">发布内容</label><br>
        <textarea id="posting" name="posting" cols="40" rows="9" maxlength="5000" required></textarea></p>
      <button type="submit">提交内容</button>
    </form>
  </main>
</body>
</html>
