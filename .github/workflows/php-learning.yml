name: PHP Learning Validation

on:
  push:
    branches: [main]
    paths:
      - 'PHPBasic/**'
      - '.github/workflows/php-learning.yml'
  pull_request:
    paths:
      - 'PHPBasic/**'
      - '.github/workflows/php-learning.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Check PHP syntax
        shell: bash
        run: |
          find PHPBasic -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test PDO book manager repository
        run: php PHPBasic/PHP06/book_manager/tests.php

      - name: Test MVC repository
        run: php PHPBasic/PHP08-MVC/tests.php

      - name: Test authentication module
        run: php PHPBasic/PHP09-Auth/tests.php

      - name: Install OOP project dependencies
        working-directory: PHPBasic/PHP07
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        working-directory: PHPBasic/PHP07
        run: composer test
