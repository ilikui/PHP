<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PHP 学习路线图</title>
  <desc id="desc">从环境与语法开始，经过数据处理、Web、数据库、面向对象、安全与工程化，最终完成项目部署。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101a35"/><stop offset="100%" stop-color="#243b65"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#777bb4"/><stop offset="100%" stop-color="#9b9fe0"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9caed0"/></marker>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="120" fill="#ffffff" opacity=".035"/><circle cx="1100" cy="560" r="180" fill="#ffffff" opacity=".03"/>
  <text x="64" y="72" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#aabbe0" letter-spacing="3">PHP LEARNING ROADMAP</text>
  <text x="64" y="125" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="38" font-weight="700" fill="#ffffff">从语法入门，到工程实践</text>
  <text x="64" y="160" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#c5d1e8">理解概念 · 运行示例 · 验证边界 · 完成项目</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="64" y="218" width="238" height="105" rx="16" fill="#f0f3ff"/><text x="183" y="255" font-size="16" fill="#6670a5">01 · FOUNDATION</text><text x="183" y="287" font-size="23" font-weight="700" fill="#172554">环境与语法</text><text x="183" y="309" font-size="13" fill="#52607e">类型 · 分支 · 循环</text>
    <rect x="342" y="218" width="238" height="105" rx="16" fill="#e5f5ff"/><text x="461" y="255" font-size="16" fill="#33759b">02 · DATA</text><text x="461" y="287" font-size="23" font-weight="700" fill="#12344b">数据与函数</text><text x="461" y="309" font-size="13" fill="#486a7c">数组 · 字符串 · JSON</text>
    <rect x="620" y="218" width="238" height="105" rx="16" fill="#e7f8ef"/><text x="739" y="255" font-size="16" fill="#2d8b62">03 · WEB</text><text x="739" y="287" font-size="23" font-weight="700" fill="#064e3b">Web 与数据库</text><text x="739" y="309" font-size="13" fill="#3e6c5a">HTTP · 表单 · PDO</text>
    <rect x="898" y="218" width="238" height="105" rx="16" fill="#fff0df"/><text x="1017" y="255" font-size="16" fill="#b66a24">04 · ENGINEERING</text><text x="1017" y="287" font-size="23" font-weight="700" fill="#713f12">工程与安全</text><text x="1017" y="309" font-size="13" fill="#8c6038">OOP · 测试 · 防护</text>
  </g>
  <g stroke="#9caed0" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M302 270 H334"/><path d="M580 270 H612"/><path d="M858 270 H890"/><path d="M1017 323 V374 H600 V407"/></g>
  <rect x="260" y="407" width="680" height="104" rx="18" fill="url(#accent)"/>
  <text x="600" y="447" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#e7e8ff" letter-spacing="2">CAPSTONE PROJECT</text>
  <text x="600" y="482" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#ffffff">独立构建、测试并部署一个 Web 项目</text>
  <text x="600" y="566" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#c5d1e8">每个阶段都要有：可运行示例 · 练习题 · 边界测试 · 复盘记录</text>
</svg>